<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TAVE MT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/slides/title.css">
<link rel="stylesheet" href="css/slides/rules.css">
<link rel="stylesheet" href="css/slides/quiz.css">
<link rel="stylesheet" href="css/slides/draw-quiz.css">
</head>
<body>

<div id="stage">
  <div class="slide-frame">
    <!-- 슬라이드들은 js/main.js가 js/slides-data.js 내용을 읽어서 여기에 자동으로 채워줌 -->
  </div>
</div>

<button id="prevBtn" class="nav-btn disabled" aria-label="이전 슬라이드">
  <svg viewBox="0 0 24 24" fill="none"><path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<button id="nextBtn" class="nav-btn disabled" aria-label="다음 슬라이드">
  <svg viewBox="0 0 24 24" fill="none"><path d="M9 5 L16 12 L9 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<div class="slide-counter" id="counter">1 / 1</div>

<!-- 1) 내용/순서 -> 2) 타입별 화면 구성 -> 3) 렌더링+버튼 동작, 순서대로 로드 -->
<script src="js/slides-data.js"></script>
<script src="js/templates.js"></script>
<script src="js/main.js"></script>
</body>
</html>
